---
name: shepherd
"on":
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
  # needs-human escalation when regen-lockfile can't salvage an agent
  # diff. Mirrors the reusable workflow's declared permissions —
  # otherwise GitHub rejects the dispatch with 'workflow file issue'.
  issues: write
jobs:
  agent:
    uses: bboortz/shepherd/.github/workflows/reusable-shepherd.yml@a0733f789845723b17afa5181d23c1f1fbcce058
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
