---
name: shepherd
"on":
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
  # needs-human escalation when regen-lockfile can't salvage an agent
  # diff. Mirrors the reusable workflow's declared permissions —
  # otherwise GitHub rejects the dispatch with 'workflow file issue'.
  issues: write
jobs:
  agent:
    uses: bboortz/shepherd/.github/workflows/reusable-shepherd.yml@4b32deb5945db1ded925b632995a8d683964e6ad # v0.12.0-rc1
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
