---
name: CI

"on":
  pull_request:
    branches:
      - main

# Cancel in-progress runs on the same PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint → ci-test → programs
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            shellcheck \
            gcc musl-tools \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            clang lld llvm \
            socat

      - name: Create musl-clang wrapper
        run: |
          sudo tee /usr/local/bin/musl-clang > /dev/null << 'EOF'
          #!/bin/sh
          exec clang \
              --target=x86_64-unknown-linux-musl \
              -isystem /usr/include/x86_64-linux-musl \
              -B/usr/lib/x86_64-linux-musl \
              -L/usr/lib/x86_64-linux-musl \
              -static-libgcc \
              "$@"
          EOF
          sudo chmod +x /usr/local/bin/musl-clang

      - name: Configure git identity
        run: |
          git config --global user.name  "CI"
          git config --global user.email "ci@kernel-test.local"

      - name: Read TOYBOX_VERSION
        id: toybox
        run: |
          ver=$(grep '^TOYBOX_VERSION' Makefile | head -1 | sed 's/.*?= *//')
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Cache Toybox binaries
        uses: actions/cache@v4
        with:
          path: cache/
          key: toybox-${{ steps.toybox.outputs.version }}

      - name: Download Toybox
        run: |
          mkdir -p cache
          for arch in x86_64 i686 aarch64 riscv64; do
            dest="cache/toybox-${arch}"
            if [[ -f "$dest" && -x "$dest" ]]; then
              echo "toybox-${arch}: cached"
              continue
            fi
            url="https://www.landley.net/toybox/downloads/binaries/${{ steps.toybox.outputs.version }}/toybox-${arch}"
            echo "Downloading toybox-${arch}..."
            curl -fsSL --output "$dest" "$url"
            chmod +x "$dest"
          done

      - name: make lint
        run: make lint

      - name: make ci-test
        run: make ci-test

      - name: make programs
        run: make programs ARCHES="x86_64 arm64 riscv"
