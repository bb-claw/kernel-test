---
schema_version: 1
version: 1
risk: low
build: make programs       # SH-019: dev-cycle contract — clean-runnable build
test: make ci-test          # SH-019: dev-cycle contract — framework tests only (no kernel tree)

auto_merge:
  patch: true
  minor: true
  major: false

gates:
  monitored_pipelines: all
  max_diff_lines: 50
  rescan_scope: high_critical
  waiting_period_hours: 6

dry_run: true
needs_human_label: needs-human
security_fix: pr-only
notify: ntfy
owner: bb-claw

dependabot:
  enforce_enabled: true
  auto_merge: true   # Wave 4 / SH-040: gated auto-merge via .github/workflows/dependabot-automerge.yml
